name: LofiGlass
options:
  bundleIdPrefix: app.lofiglass
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.35.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: NO
    OTHER_LDFLAGS: "-framework AVFoundation -framework WebKit"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  LofiGlass:
    type: application
    platform: iOS
    sources:
      - path: LofiGlass
        excludes:
          - "**/Info.plist"
          - "**/Resources/Fonts/README.md"
      # One seed corpus, shared with the prototype — no duplicate to forget.
      - path: ../shared/seed/lofi-feed.json
        name: lofi-feed.json
        buildPhase: resources
    info:
      path: LofiGlass/Info.plist
      properties:
        CFBundleDisplayName: lofi.glass
        CFBundleName: LofiGlass
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: APPL
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
          UIImage: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: app.lofiglass.deck
            CFBundleURLSchemes:
              - lofiglass
        # Web content (the YouTube embed) needs to load http-adjacent media; the
        # app itself stays ATS-strict except for a local resolver during dev.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        # Dev fallback only: Settings can also hold the key, and UserDefaults is
        # NOT where a shipping key belongs (use the Keychain).
        YouTubeAPIKey: ""
        ITSAppUsesNonExemptEncryption: false
        # Add Michroma + VT323 to LofiGlass/Resources/Fonts to get the real Y2K
        # faces; without them Font.custom falls back to the rounded system face.
        UIAppFonts:
          - Michroma-Regular.ttf
          - VT323-Regular.ttf

  LofiGlassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LofiGlassTests
    dependencies:
      - target: LofiGlass
    info:
      path: LofiGlassTests/Info.plist
      properties:
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"

schemes:
  LofiGlass:
    build:
      parallelizeBuildables: true
      targets:
        LofiGlass: all
        LofiGlassTests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: OS_ACTIVITY_MODE
          value: disable
          isEnabled: false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: LofiGlassTests
          parallelizable: false
          randomExecutionOrder: true
